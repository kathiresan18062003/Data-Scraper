services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: data_scraper_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - DATABASE_URL=sqlite:////app/data/scraper.db
      - DATA_DIR=/app/data
      - OUTPUT_DIR=/app/output
      - FRONTEND_ORIGIN=http://localhost:5173,http://127.0.0.1:5173,https://data-scraper-kathiresan-m1.vercel.app
    volumes:
      - scraper_data:/app/data
      - scraper_output:/app/output
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  scraper_data:
  scraper_output:
