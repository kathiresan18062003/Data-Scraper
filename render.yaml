# Render Blueprint: one Docker web service (API + frontend) with a persistent disk
# for uploads/Excel outputs, plus a managed Postgres database for jobs and results.
# Deploy via Render Dashboard -> New -> Blueprint -> select this repo.
services:
  - type: web
    name: data-scraper
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    disk:
      name: scraper-files
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: data-scraper-db
          property: connectionString
      - key: DATA_DIR
        value: /var/data/data
      - key: OUTPUT_DIR
        value: /var/data/output
      - key: GEMINI_API_KEY
        sync: false

databases:
  - name: data-scraper-db
    plan: basic-256mb
    databaseName: scraper
